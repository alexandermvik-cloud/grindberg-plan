*{box-sizing:border-box}

.day.today{border-color:var(--signal);box-shadow:inset 0 -3px 0 var(--signal)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.note{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--signal);border-radius:8px;padding:12px 14px}

.task.dim{opacity:.45}
.stl{padding:1px 8px;border-radius:4px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:700}

.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-right:7px}

.chip{padding:1px 9px;border-radius:999px;background:var(--cc);color:var(--paper);font-size:13px;font-weight:700}
.task.done .t,.task.done .o{text-decoration:line-through}
.task.done .ok{font-size:12.5px;font-weight:700;color:var(--muted)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted)}
.toggle{align-self:flex-start;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.lev{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}

.lev div:first-child{border-top:0}
.lev span:last-child{white-space:nowrap;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.install{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}

.login{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;margin-top:10px}

.login input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-size:20px;letter-spacing:.04em;min-height:50px;width:100%}
.login button{border:0;background:var(--accent);color:var(--paper);border-radius:8px;padding:12px;font-weight:700;font-size:17px;min-height:50px}
.login button[disabled]{opacity:.6}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}
.awaybox{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}

.awaybox .aw{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.report{align-self:stretch;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px;font-weight:700;font-size:16px;min-height:48px}
.repf{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.repf h2{margin:0;font-family:var(--display);font-size:24px}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fl select,.fl input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;font:inherit;min-height:46px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.racts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.btnp,.btns{display:block;text-align:center;text-decoration:none;border-radius:8px;padding:12px;font-weight:700;font-size:16px;min-height:48px}
.btnp{background:var(--accent);color:var(--paper)}
.btns{border:1px solid var(--line);color:var(--ink)}
.repf .hint{margin:0;font-size:13px;color:var(--muted)}
.repf .err{margin:0;color:#b3261e;font-weight:700}
.mode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.mode button{border:0;background:none;padding:9px;font-weight:700;font-size:15px;min-height:42px}

.calh,.calr{display:grid;grid-template-columns:26px repeat(5,minmax(0,1fr));gap:4px}

.calc{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:4px;min-height:74px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;min-width:0;overflow:hidden}

.langs button{border:0;background:none;color:inherit;font:inherit;font-weight:700;font-size:12.5px;padding:6px 8px;border-radius:6px;min-height:32px;opacity:.75}

</style>
