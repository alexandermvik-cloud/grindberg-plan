<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arbeidsplan Grindberg</title>
<meta name="description" content="Arbeidsplan for verkstedet på Grindberg Trevarefabrikk">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d2320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arbeidsplan">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#eef0ec;--paper:#fff;--ink:#1d2320;--muted:#5d6862;--line:#d3d8d2;--soft:#e4e8e2;
  --signal:#f2c230;--signal-ink:#3a2f00;--accent:#2f5d50;
  --p0:#2f6fb3;--p1:#d0661f;--p2:#2e8a57;--p3:#8a3fa8;--p4:#9a7a00;--p5:#c23b6b;--p6:#2a8f9c;--p7:#8a5a3a;--p8:#c0392b;--p9:#66707a;--p10:#6b7a1f;--p11:#2c3e8f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151917;--paper:#1e2421;--ink:#e7ece8;--muted:#9aa59f;--line:#333c37;--soft:#262d29;--signal:#e0b52c;--signal-ink:#2a2200;--accent:#6fb39f;
  --p0:#6aa7e8;--p1:#f08a4b;--p2:#5cc48a;--p3:#c084e0;--p4:#e6c445;--p5:#ef7aa3;--p6:#62c6d3;--p7:#c99a78;--p8:#f07a6c;--p9:#a3acb5;--p10:#b5c45a;--p11:#8a9cf0;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
@media (prefers-color-scheme:dark){.top{background:#0c0f0d;color:var(--ink)}}
.top .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:38px;height:38px;border-radius:50%;background:#fff;flex:0 0 auto}
.top h1{margin:0;font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.top .sub{font-size:12.5px;opacity:.75}
.wrap{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.people{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.pp{flex:0 0 auto;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px 5px 8px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.pp .d{width:12px;height:12px;border-radius:50%;background:var(--cc)}
.pp[aria-pressed="true"]{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 22%,var(--paper))}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav b{font-family:var(--display);font-size:22px;font-weight:700}
.weeknav button{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:40px;height:38px;font-size:18px}
.weeknav button[disabled]{opacity:.35;cursor:default}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;position:relative}
.day .n{font-weight:700;font-size:14px}
.day .dt{font-size:12px;color:var(--muted)}
.day .c{position:absolute;top:4px;right:5px;min-width:16px;height:16px;border-radius:8px;background:var(--cc,var(--muted));color:var(--paper);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.day.today{border-color:var(--signal);box-shadow:inset 0 -3px 0 var(--signal)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day[aria-pressed="true"] .dt{color:inherit;opacity:.75}
.note{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--signal);border-radius:8px;padding:12px 14px}
.note h2{margin:0 0 4px;font-family:var(--display);font-size:20px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dayh{font-family:var(--display);font-size:26px;font-weight:700;margin:4px 0 0}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h3{margin:6px 0 0;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.task{--pc:var(--line);background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.task.has-p{background:color-mix(in srgb,var(--pc) 16%,var(--paper));border-color:color-mix(in srgb,var(--pc) 40%,var(--paper));border-left-color:var(--pc)}
.task.dim{opacity:.45}
.stl{padding:1px 8px;border-radius:4px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:700}
.med{font-size:13px;color:var(--muted)}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-right:7px}
.task .o{font-weight:700;font-size:14px;color:var(--muted)}
.task .t{font-size:16.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.task .t.b{font-weight:700}
.task .w{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip{padding:1px 9px;border-radius:999px;background:var(--cc);color:var(--paper);font-size:13px;font-weight:700}
.task.done .t,.task.done .o{text-decoration:line-through}
.task.done .ok{font-size:12.5px;font-weight:700;color:var(--muted)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted)}
.toggle{align-self:flex-start;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.lev{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lev div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:15px}
.lev div:first-child{border-top:0}
.lev span:last-child{white-space:nowrap;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.install{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.install b{font-size:15px}
.login{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.login h2{margin:0;font-family:var(--display);font-size:28px}
.login p{margin:0;color:var(--muted)}
.login .err{color:#b3261e;font-weight:700}
@media (prefers-color-scheme:dark){.login .err{color:#ff8a80}}
.login input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-size:20px;letter-spacing:.04em;min-height:50px;width:100%}
.login button{border:0;background:var(--accent);color:var(--paper);border-radius:8px;padding:12px;font-weight:700;font-size:17px;min-height:50px}
.login button[disabled]{opacity:.6}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}
.awaybox{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.awaybox h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.awaybox .aw{font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.report{align-self:stretch;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:12px;font-weight:700;font-size:16px;min-height:48px}
.repf{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.repf h2{margin:0;font-family:var(--display);font-size:24px}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fl select,.fl input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;font:inherit;min-height:46px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.racts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.btnp,.btns{display:block;text-align:center;text-decoration:none;border-radius:8px;padding:12px;font-weight:700;font-size:16px;min-height:48px}
.btnp{background:var(--accent);color:var(--paper)}
.btns{border:1px solid var(--line);color:var(--ink)}
.repf .hint{margin:0;font-size:13px;color:var(--muted)}
.repf .err{margin:0;color:#b3261e;font-weight:700}
.mode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.mode button{border:0;background:none;padding:9px;font-weight:700;font-size:15px;min-height:42px}
.mode button+button{border-left:1px solid var(--line)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.calh,.calr{display:grid;grid-template-columns:26px repeat(5,minmax(0,1fr));gap:4px}
.calh span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}
.calw{display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:11px;color:var(--muted)}
.calc{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:4px;min-height:74px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;min-width:0;overflow:hidden}
.calc.past{opacity:.55}
.calc.today{border:2px solid var(--signal)}
.calc.away{background:repeating-linear-gradient(135deg,color-mix(in srgb,#c0392b 10%,var(--paper)) 0 7px,var(--paper) 7px 14px)}
.cd{display:flex;align-items:baseline;gap:3px;font-weight:700;font-size:14px}
.cd small{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase}
.cj{display:block;font-size:10.5px;line-height:1.25;padding:1px 3px;border-radius:3px;background:color-mix(in srgb,var(--pc) 22%,var(--paper));border-left:3px solid var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:10.5px;color:var(--muted);font-weight:600}
.cab{font-size:10.5px;font-weight:700;color:#b3261e}
@media (prefers-color-scheme:dark){.cab{color:#ff8a80}}
.cdots{display:flex;flex-wrap:wrap;gap:3px}
.cdots i{width:9px;height:9px;border-radius:50%;background:var(--cc);display:block}
.hint2{margin:0;font-size:13px;color:var(--muted)}
.install button{align-self:flex-end;border:0;background:none;color:var(--muted);font-size:13px;padding:2px 0}
</style>
</head>
<body>
<header class="top"><div class="row"><img src="icon-192.png" alt=""><div><h1>Arbeidsplan</h1><div class="sub" id="upd"></div></div></div></header>
<main class="wrap" id="app"><div class="empty">Åpner planen …</div></main>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
var P=JSON.parse(document.getElementById("data").textContent),D=null;
var DAYS=["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"],MON=["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function wk(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function wkey(d){return d.getFullYear()+"-W"+pad(wk(d))}
function short(d){return d.getDate()+". "+MON[d.getMonth()]}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

var now=new Date(),TODAY=iso(now);
var base=monday(now);if(now.getDay()===6||now.getDay()===0)base=add(base,7);
var weeks=[0,1,2,3,4,5].map(function(i){return add(base,7*i)});
var S={w:0,day:null,me:get("gb-me")||"",all:get("gb-all")==="1",cal:get("gb-cal")==="1"};
(function(){var di=(now.getDay()+6)%7;S.day=(now.getDay()===6||now.getDay()===0)?iso(base):(di<5?TODAY:iso(base))})();

function pIdx(n){n=(n||"").trim();if(!n)return -1;var f=D.farger||{};if(f[n]!=null)return f[n]%12;var i=D.ansatte.indexOf(n);return i>=0?i%12:-1}
function pv(i){return i<0?"var(--muted)":"var(--p"+i+")"}
function names(t){return (t.hvem||"").split(",").map(function(x){return x.trim()}).filter(Boolean)}
function order(id){for(var i=0;i<D.ordre.length;i++)if(D.ordre[i].id===id)return D.ordre[i];return null}
function mine(t){return !S.me||names(t).indexOf(S.me)>=0}
function awayOn(day){return (D.fravaer||[]).filter(function(f){return f.fra<=day&&(f.til||f.fra)>=day})}
function tasksOn(day){return D.oppgaver.filter(function(t){return t.dato===day})}

function setUpd(){var u=new Date(D.oppdatert);document.getElementById("upd").textContent="Oppdatert "+DAYS[(u.getDay()+6)%7].toLowerCase()+" "+short(u)+" kl. "+pad(u.getHours())+":"+pad(u.getMinutes())}

function renderCal(app){
  var head=el("div","calh");head.appendChild(el("span"));["Man","Tir","Ons","Tor","Fre"].forEach(function(d){head.appendChild(el("span",null,d))});app.appendChild(head);
  weeks.forEach(function(ws,wi){
    var row=el("div","calr");var wl=el("span","calw");wl.appendChild(el("b",null,String(wk(ws))));row.appendChild(wl);
    [0,1,2,3,4].forEach(function(i){var d=add(ws,i),di=iso(d);
      var ts=tasksOn(di).filter(mine);var aw=awayOn(di);var meAway=S.me&&aw.some(function(f){return f.hvem===S.me});
      var c=el("button","calc"+(di===TODAY?" today":"")+(di<TODAY?" past":"")+(meAway?" away":""));c.type="button";
      c.setAttribute("aria-label",DAYS[(d.getDay()+6)%7]+" "+short(d)+": "+ts.length+" jobber");
      var top=el("span","cd");top.appendChild(el("span",null,String(d.getDate())));if(d.getDate()===1||(wi===0&&i===0))top.appendChild(el("small",null,MON[d.getMonth()]));c.appendChild(top);
      if(meAway){c.appendChild(el("span","cab",(aw.filter(function(f){return f.hvem===S.me})[0].type)||"Borte"))}
      else if(S.me){ts.slice(0,3).forEach(function(t){var o=order(t.ordreId);var x=el("span","cj",(o&&o.nr?o.nr+" ":"")+(t.tekst||(o&&o.navn)||"Jobb"));x.style.setProperty("--pc",pv(pIdx(S.me)));c.appendChild(x)});
        if(ts.length>3)c.appendChild(el("span","cm","+"+(ts.length-3)))}
      else{var dots=el("span","cdots");var who=[];ts.forEach(function(t){names(t).forEach(function(n){if(who.indexOf(n)<0)who.push(n)})});
        who.slice(0,9).forEach(function(n){var dt=el("i");dt.style.setProperty("--cc",pv(pIdx(n)));dt.title=n;dots.appendChild(dt)});c.appendChild(dots);
        if(ts.length)c.appendChild(el("span","cm",ts.length+(ts.length===1?" jobb":" jobber")));
        if(aw.length)c.appendChild(el("span","cab",aw.length+" borte"))}
      c.onclick=function(){S.cal=false;set("gb-cal",null);S.w=wi;S.day=di;render();window.scrollTo(0,0)};
      row.appendChild(c)});
    app.appendChild(row);
    var note=(D.uker[wkey(ws)]||{}).tekst;if(note&&wi>0){}
  });
  app.appendChild(el("p","hint2",S.me?"Viser jobbene til "+S.me+". Trykk på en dag for detaljer.":"Prikkene viser hvem som har jobber. Trykk på en dag for detaljer."));
}
function render(){
  var app=document.getElementById("app");app.innerHTML="";
  var ws=weeks[S.w],days=[0,1,2,3,4].map(function(i){return add(ws,i)});

  // hvem er du
  if(D.ansatte.length){
    var box=el("section");box.appendChild(el("p","lbl","Hvem er du?"));
    var row=el("div","people");
    [""].concat(D.ansatte).forEach(function(n){
      var b=el("button","pp");b.type="button";b.setAttribute("aria-pressed",String(S.me===n));
      b.style.setProperty("--cc",n?pv(pIdx(n)):"var(--ink)");
      if(n){var d=el("span","d");b.appendChild(d)}b.appendChild(document.createTextNode(n||"Alle"));
      b.onclick=function(){S.me=n;set("gb-me",n||null);render()};row.appendChild(b)});
    box.appendChild(row);app.appendChild(box);
  }

  // visning
  var mode=el("div","mode");[["Dag",false],["Kalender",true]].forEach(function(m){var b=el("button",null,m[0]);b.type="button";b.setAttribute("aria-pressed",String(S.cal===m[1]));
    b.onclick=function(){S.cal=m[1];set("gb-cal",m[1]?"1":null);render();window.scrollTo(0,0)};mode.appendChild(b)});app.appendChild(mode);
  if(S.cal){renderCal(app)}else{
  // uke
  var nav=el("div","weeknav");var pv_=el("button",null,"‹");pv_.type="button";pv_.setAttribute("aria-label","Forrige uke");pv_.disabled=S.w===0;
  pv_.onclick=function(){S.w--;S.day=iso(weeks[S.w]);render()};
  var nx=el("button",null,"›");nx.type="button";nx.setAttribute("aria-label","Neste uke");nx.disabled=S.w===weeks.length-1;
  nx.onclick=function(){S.w++;S.day=iso(weeks[S.w]);render()};
  nav.appendChild(pv_);nav.appendChild(el("b",null,"Uke "+wk(ws)+" · "+short(days[0])+" – "+short(days[4])));nav.appendChild(nx);app.appendChild(nav);

  var grid=el("div","days");
  days.forEach(function(d){var di=iso(d);var b=el("button","day"+(di===TODAY?" today":""));b.type="button";b.setAttribute("aria-pressed",String(S.day===di));
    b.appendChild(el("span","n",DAYS[(d.getDay()+6)%7].slice(0,3)));b.appendChild(el("span","dt",short(d)));
    var cnt=tasksOn(di).filter(mine).length;if(cnt){var c=el("span","c",String(cnt));if(S.me)c.style.setProperty("--cc",pv(pIdx(S.me)));b.appendChild(c)}
    b.onclick=function(){S.day=di;render()};grid.appendChild(b)});
  app.appendChild(grid);

  var note=(D.uker[wkey(ws)]||{}).tekst;
  if(note){var n=el("section","note");n.appendChild(el("h2",null,"Beskjed"));n.appendChild(el("p",null,note));app.appendChild(n)}

  var aw=awayOn(S.day);
  var sd=parse(S.day);app.appendChild(el("h2","dayh",DAYS[(sd.getDay()+6)%7]+" "+short(sd)+(S.day===TODAY?" · i dag":"")));
  if(aw.length){var ab=el("section","awaybox");ab.appendChild(el("h3",null,"Borte"));var al=el("div","w");
    aw.forEach(function(f){var x=el("span","aw");var ch=el("span","chip",f.hvem);ch.style.setProperty("--cc",pv(pIdx(f.hvem)));x.appendChild(ch);x.appendChild(document.createTextNode(" "+(f.type||"Borte")));al.appendChild(x)});ab.appendChild(al);app.appendChild(ab)}
  var all=tasksOn(S.day);var show=S.me&&!S.all?all.filter(mine):all;
  if(!all.length){app.appendChild(el("div","empty","Ingenting planlagt denne dagen."))}
  else if(!show.length){app.appendChild(el("div","empty",S.me+" har ingen jobber denne dagen."))}
  function stn(id){for(var i=0;i<D.stasjoner.length;i++)if(D.stasjoner[i].id===id)return D.stasjoner[i].navn;return ""}
  function card(t,person){var o=order(t.ordreId);var ns=names(t);var pi=pIdx(person||ns[0]);
    var c=el("article","task"+(t.ferdig?" done":"")+(pi>=0?" has-p":"")+(S.me&&S.all&&!mine(t)?" dim":""));if(pi>=0)c.style.setProperty("--pc","var(--p"+pi+")");
    if(o)c.appendChild(el("div","o",(o.nr?o.nr+" · ":"")+(o.navn||"")+(o.hva?" · "+o.hva:"")));
    if(t.tekst)c.appendChild(el("div","t"+(o?"":" b"),t.tekst));
    var w=el("div","w");var sn=stn(t.stasjon);if(sn)w.appendChild(el("span","stl",sn));
    var others=person?ns.filter(function(n){return n!==person}):ns;
    if(person&&others.length)w.appendChild(el("span","med","med"));
    others.forEach(function(n){var ch=el("span","chip",n);ch.style.setProperty("--cc",pv(pIdx(n)));w.appendChild(ch)});
    if(w.childNodes.length)c.appendChild(w);
    if(t.ferdig)c.appendChild(el("div","ok","✓ Ferdig"));return c}
  var groups=[];
  if(S.me&&!S.all){groups=[{label:null,person:S.me,ts:show}]}
  else{D.ansatte.forEach(function(n){var ts=show.filter(function(t){return names(t).indexOf(n)>=0});if(ts.length)groups.push({label:n,person:n,ts:ts})});
    var un=show.filter(function(t){return !names(t).some(function(n){return D.ansatte.indexOf(n)>=0})});if(un.length)groups.push({label:"Ikke fordelt",person:null,ts:un})}
  groups.forEach(function(gr){var g=el("section","grp");
    if(gr.label){var hh=el("h3");if(gr.person){var dt=el("span","pdot");dt.style.setProperty("--pc",pv(pIdx(gr.person)));hh.appendChild(dt)}hh.appendChild(document.createTextNode(gr.label));g.appendChild(hh)}
    gr.ts.slice().sort(function(a,b){return (a.opprettet||0)-(b.opprettet||0)}).forEach(function(t){g.appendChild(card(t,gr.person))});
    app.appendChild(g)});
  if(S.me&&all.length&&all.length!==all.filter(mine).length){var tg=el("button","toggle",S.all?"Vis bare mine jobber":"Vis hele verkstedet");tg.type="button";tg.onclick=function(){S.all=!S.all;set("gb-all",S.all?"1":null);render()};app.appendChild(tg)}

  }
  var mb=el("button","report","Meld fravær");mb.type="button";mb.onclick=function(){S.rep=!S.rep;render();if(S.rep)setTimeout(function(){var e=document.getElementById("rep");if(e)e.scrollIntoView({behavior:"smooth",block:"start"})},30)};app.appendChild(mb);
  if(S.rep)app.appendChild(reportForm());
  var lev=D.ordre.filter(function(o){return o.levering}).sort(function(a,b){return a.levering<b.levering?-1:1});
  if(lev.length){app.appendChild(el("p","lbl","Kommende leveranser"));var L=el("section","lev");
    lev.forEach(function(o){var r=el("div");r.appendChild(el("span",null,(o.nr?o.nr+" · ":"")+(o.navn||"")+(o.hva?" – "+o.hva:"")));r.appendChild(el("span",null,short(parse(o.levering))));L.appendChild(r)});app.appendChild(L)}

  var standalone=window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if(!standalone&&!get("gb-noinst")){var ins=el("section","install");ins.appendChild(el("b",null,"Legg planen på hjemskjermen"));
    var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    ins.appendChild(el("span",null,ios?"Trykk Del-knappen i Safari (firkant med pil opp) og velg «Legg til på Hjem-skjerm».":"Trykk ⋮ øverst i Chrome og velg «Legg til på startskjermen» eller «Installer app»."));
    var x=el("button",null,"Skjul");x.type="button";x.onclick=function(){set("gb-noinst","1");render()};ins.appendChild(x);app.appendChild(ins)}

  var ft=el("p","foot","Grindberg Trevarefabrikk · Kilegrend · ");var lo=el("button","link","Logg ut");lo.type="button";lo.onclick=logout;ft.appendChild(lo);app.appendChild(ft);
}
// ---------- fravær ----------
var TYPER=["Syk","Egenmelding","Sykt barn","Ferie / fri","Lege / tannlege","Annet"];
function reportForm(){
  var f=el("form","repf");f.id="rep";f.appendChild(el("h2",null,"Meld fravær"));
  function fld(lbl,inp){var w=el("label","fl");w.appendChild(el("span",null,lbl));w.appendChild(inp);return w}
  var who=el("select");who.id="r-hvem";[""].concat(D.ansatte).forEach(function(n){var o=el("option",null,n||"Velg navn");o.value=n;if(n===S.me)o.selected=true;who.appendChild(o)});
  var fra=el("input");fra.type="date";fra.id="r-fra";fra.value=S.day<TODAY?TODAY:S.day;
  var til=el("input");til.type="date";til.id="r-til";til.value=fra.value;fra.onchange=function(){if(!til.value||til.value<fra.value)til.value=fra.value};
  var typ=el("select");typ.id="r-type";TYPER.forEach(function(t){var o=el("option",null,t);o.value=t;typ.appendChild(o)});
  var nt=el("input");nt.id="r-notat";nt.placeholder="Valgfritt";
  f.appendChild(fld("Hvem",who));var row=el("div","two");row.appendChild(fld("Fra",fra));row.appendChild(fld("Til og med",til));f.appendChild(row);
  f.appendChild(fld("Årsak",typ));f.appendChild(fld("Merknad",nt));
  var msg=el("p","err");msg.hidden=true;f.appendChild(msg);
  function text(){var a=parse(fra.value),b=parse(til.value||fra.value);var per=fra.value===til.value||!til.value?DAYS[(a.getDay()+6)%7].toLowerCase()+" "+short(a):short(a)+" – "+short(b);
    return "Fravær: "+who.value+" – "+typ.value+" "+per+(nt.value.trim()?". "+nt.value.trim():"")}
  function ok(){if(!who.value){msg.textContent="Velg navnet ditt.";msg.hidden=false;return false}if(!fra.value){msg.textContent="Velg dato.";msg.hidden=false;return false}msg.hidden=true;return true}
  var acts=el("div","racts");
  var sms=el("a","btnp","Send SMS til "+D.kontakt.navn);sms.href="#";sms.onclick=function(e){e.preventDefault();if(!ok())return;var sep=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)?"&":"?";location.href="sms:"+D.kontakt.sms+sep+"body="+encodeURIComponent(text())};
  var ml=el("a","btns","Send e-post");ml.href="#";ml.onclick=function(e){e.preventDefault();if(!ok())return;location.href="mailto:"+D.kontakt.epost+"?subject="+encodeURIComponent(text())+"&body="+encodeURIComponent(text())};
  acts.appendChild(sms);acts.appendChild(ml);f.appendChild(acts);
  f.appendChild(el("p","hint","Meldingen åpnes ferdig utfylt. Du må trykke send selv. "+D.kontakt.navn+" legger fraværet inn i planen."));
  f.onsubmit=function(e){e.preventDefault()};
  return f;
}
// ---------- kode ----------
var enc=new TextEncoder();
function norm(c){return (c||"").toLowerCase().replace(/\s+/g,"").trim()}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function hex(u){return Array.prototype.map.call(u,function(x){return ("0"+x.toString(16)).slice(-2)}).join("")}
function unhex(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
function bin(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return s}
var hasSubtle=!!(window.crypto&&crypto.subtle);
function loadForge(){return new Promise(function(res,rej){if(window.forge)return res();var sc=document.createElement("script");sc.src="forge.min.js";sc.onload=function(){res()};sc.onerror=function(){rej(new Error("nocrypto"))};document.head.appendChild(sc)})}
async function derive(code){
  if(hasSubtle){var km=await crypto.subtle.importKey("raw",enc.encode(norm(code)),"PBKDF2",false,["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(P.salt),iterations:P.iter,hash:"SHA-256"},km,256))}
  await loadForge();var k=forge.pkcs5.pbkdf2(forge.util.encodeUtf8(norm(code)),bin(b64d(P.salt)),P.iter,32,forge.md.sha256.create());
  var u=new Uint8Array(32);for(var i=0;i<32;i++)u[i]=k.charCodeAt(i);return u}
async function decrypt(key){
  var ct=b64d(P.ct),iv=b64d(P.iv);
  if(hasSubtle){var ck=await crypto.subtle.importKey("raw",key,{name:"AES-GCM"},false,["decrypt"]);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},ck,ct)))}
  await loadForge();var d=forge.cipher.createDecipher("AES-GCM",bin(key));d.start({iv:bin(iv),tagLength:128,tag:forge.util.createBuffer(bin(ct.slice(ct.length-16)))});
  d.update(forge.util.createBuffer(bin(ct.slice(0,ct.length-16))));if(!d.finish())throw new Error("feil");return JSON.parse(forge.util.decodeUtf8(d.output.getBytes()))}
async function open_(code){var key=await derive(code);var data=await decrypt(key);set("gb-key",hex(key));set("gb-salt",P.salt);return data}
async function openSaved(){var k=get("gb-key");if(k&&get("gb-salt")===P.salt)return decrypt(unhex(k));var c=get("gb-kode");if(c)return open_(c);throw new Error("ingen")}
function start(data){D=data;if(S.me&&D.ansatte.indexOf(S.me)<0)S.me="";setUpd();render()}
function login(msg){
  var app=document.getElementById("app");app.innerHTML="";document.getElementById("upd").textContent="Grindberg Trevarefabrikk";
  var f=el("form","login");f.appendChild(el("h2",null,"Logg inn"));
  if(msg){f.appendChild(el("p","err",msg))}
  f.appendChild(el("p",null,"Skriv inn koden du har fått for arbeidsplanen. Telefonen husker den etterpå."));
  var i=el("input");i.id="kode";i.type="text";i.autocomplete="off";i.autocapitalize="none";i.spellcheck=false;i.setAttribute("aria-label","Kode");i.placeholder="Kode";f.appendChild(i);
  var b=el("button",null,"Åpne planen");b.type="submit";f.appendChild(b);
  f.onsubmit=function(e){e.preventDefault();var c=i.value;if(!norm(c)){i.focus();return}b.disabled=true;b.textContent=hasSubtle?"Åpner …":"Åpner … (kan ta noen sekunder)";
    open_(c).then(function(d){set("gb-kode",norm(c));start(d)}).catch(function(err){login(err&&err.message==="nocrypto"?"Fikk ikke åpnet planen. Sjekk at du har nett og prøv igjen.":"Feil kode. Prøv igjen.")})};
  app.appendChild(f);setTimeout(function(){i.focus()},50);
}
function logout(){set("gb-kode",null);set("gb-key",null);set("gb-salt",null);login()}
if(get("gb-kode")||get("gb-key")){openSaved().then(start).catch(function(e){if(e&&e.message==="nocrypto"){login("Fikk ikke åpnet planen. Sjekk at du har nett og prøv igjen.");return}set("gb-kode",null);set("gb-key",null);login("Koden er byttet. Skriv inn den nye koden.")})}else login();
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&Date.now()-now.getTime()>30*60e3)location.reload()});
})();
</script>
