<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../icon-32.png"><style>.gb-login{position:fixed;inset:0;z-index:100;background:var(--bg,#eef0ec);display:grid;place-items:center;padding:16px}
.gb-login form{background:var(--paper,#fff);border:1px solid var(--line,#d3d8d2);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px}
.gb-login h1{margin:0;font-family:var(--display,sans-serif);font-size:32px}.gb-login p{margin:0;color:var(--muted,#5d6862)}.gb-login .e{color:var(--danger,#b3261e);font-weight:700}
.gb-login input{border:1px solid var(--line,#d3d8d2);border-radius:8px;padding:12px;font:inherit;font-size:18px;background:var(--bg,#eef0ec);color:inherit}
.gb-login button{border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;background:var(--accent,#2f5d50);color:var(--accent-ink,#fff);cursor:pointer}</style><style>body{margin:0}</style></head><body>
<title>Produksjonsplan Grindberg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: verkstedtavle — stasjoner som rader, ukedager som kolonner; leveranser i egen stripe. Telefon: dag for dag. */
:root{
  --bg:#eef0ec; --paper:#ffffff; --ink:#1d2320; --muted:#5d6862; --line:#d3d8d2; --soft:#e4e8e2;
  --signal:#f2c230; --signal-ink:#3a2f00; --accent:#2f5d50; --accent-ink:#ffffff;
  --danger:#b3261e; --danger-bg:#fbe9e7; --warn:#8a5a00; --warn-bg:#fdf1d6; --ok:#2e6b3a; --ok-bg:#e3f1e5;
  --o0:#2f6fb3; --o1:#c2571a; --o2:#2e8a57; --o3:#8a3fa8; --o4:#b8872a; --o5:#c23b6b; --o6:#3a8f9a; --o7:#6b6f2a;
  --p0:#2f6fb3; --p1:#d0661f; --p2:#2e8a57; --p3:#8a3fa8; --p4:#9a7a00; --p5:#c23b6b; --p6:#2a8f9c; --p7:#8a5a3a; --p8:#c0392b; --p9:#66707a; --p10:#6b7a1f; --p11:#2c3e8f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151917; --paper:#1e2421; --ink:#e7ece8; --muted:#9aa59f; --line:#333c37; --soft:#262d29;
  --signal:#e0b52c; --signal-ink:#2a2200; --accent:#6fb39f; --accent-ink:#0f1d18;
  --danger:#ff8a80; --danger-bg:#3a1d1b; --warn:#f0c060; --warn-bg:#33290f; --ok:#8fd19c; --ok-bg:#1b3121;
  --o0:#6aa7e8; --o1:#f08a4b; --o2:#5cc48a; --o3:#c084e0; --o4:#e0b85a; --o5:#ef7aa3; --o6:#6cc6d1; --o7:#b8bd5c;
  --p0:#6aa7e8; --p1:#f08a4b; --p2:#5cc48a; --p3:#c084e0; --p4:#e6c445; --p5:#ef7aa3; --p6:#62c6d3; --p7:#c99a78; --p8:#f07a6c; --p9:#a3acb5; --p10:#b5c45a; --p11:#8a9cf0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151917; --paper:#1e2421; --ink:#e7ece8; --muted:#9aa59f; --line:#333c37; --soft:#262d29;
  --signal:#e0b52c; --signal-ink:#2a2200; --accent:#6fb39f; --accent-ink:#0f1d18;
  --danger:#ff8a80; --danger-bg:#3a1d1b; --warn:#f0c060; --warn-bg:#33290f; --ok:#8fd19c; --ok-bg:#1b3121;
  --o0:#6aa7e8; --o1:#f08a4b; --o2:#5cc48a; --o3:#c084e0; --o4:#e0b85a; --o5:#ef7aa3; --o6:#6cc6d1; --o7:#b8bd5c;
  --p0:#6aa7e8; --p1:#f08a4b; --p2:#5cc48a; --p3:#c084e0; --p4:#e6c445; --p5:#ef7aa3; --p6:#62c6d3; --p7:#c99a78; --p8:#f07a6c; --p9:#a3acb5; --p10:#b5c45a; --p11:#8a9cf0;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1;text-wrap:balance}
.brand h1 .wk{display:inline-block;background:var(--signal);color:var(--signal-ink);padding:0 .25em;margin-left:.15em;border-radius:3px}
.brand .range{font-family:var(--mono);font-size:13px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:14px;min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.notice{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 14px;color:var(--muted);font-size:14px}
.notice.err{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}

/* Leveranser-stripe */
.deliveries{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.02em}
.sec-h span{font-size:13px;color:var(--muted)}
.dl-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.dl{flex:0 0 auto;min-width:170px;max-width:240px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--oc);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left}
.dl b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .what{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .when{font-family:var(--mono);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.late{background:var(--danger-bg);color:var(--danger)}
.pill.soon{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

/* Ukegrid */
.board-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table.board{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
.board th,.board td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;padding:0}
.board tr>*:last-child{border-right:0}
.board tbody tr:last-child>*{border-bottom:0}
.board thead th{padding:8px 10px;text-align:left;background:var(--soft);font-weight:600}
.board thead th .dn{font-family:var(--display);font-size:19px;font-weight:600;display:block;line-height:1.1}
.board thead th .dd{font-family:var(--mono);font-size:12px;color:var(--muted)}
.board thead th.today{background:var(--signal);color:var(--signal-ink)}
.board thead th.today .dd{color:var(--signal-ink)}
.board th.st{width:130px;padding:10px;text-align:left;background:var(--soft);font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em}
.board td.today{background:color-mix(in srgb,var(--signal) 8%,var(--paper))}
.cell{display:flex;flex-direction:column;gap:6px;padding:6px;min-height:74px}
.add{border:1px dashed var(--line);background:transparent;border-radius:5px;color:var(--muted);font-size:13px;padding:4px;min-height:30px;opacity:.75}
.add:hover{opacity:1;border-color:var(--muted);color:var(--ink)}

.task{--pc:var(--line);display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:5px;padding:6px 8px;text-align:left;width:100%;min-width:0}
.task .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.task .on{font-weight:700;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.task .de{font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.awayrow th,.awayrow td{background:color-mix(in srgb,var(--danger) 5%,var(--paper))}
.cell.aw{min-height:44px;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:5px}
.cell.aw .add{flex:1 0 100%}
.away{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 8px 2px 2px;font-size:12px;color:var(--muted);max-width:100%}
.away .at{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow th.st{background:color-mix(in srgb,var(--pc) 14%,var(--soft))}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-right:7px;vertical-align:1px}
.board td.isaway{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--danger) 7%,var(--paper)) 0 8px,var(--paper) 8px 16px)}
.stl{display:inline-block;padding:0 7px;border-radius:4px;background:var(--soft);color:var(--ink);font-size:11.5px;font-weight:700;line-height:18px;border:1px solid var(--line)}
.med{font-size:11.5px;color:var(--muted);line-height:18px}
.olines{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.olines summary{cursor:pointer;font-weight:700;font-size:14px}
.ol{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:320px;overflow:auto}
.oli{display:grid;grid-template-columns:42px 1fr;gap:8px;font-size:13.5px}
.oli .q{font-family:var(--mono);color:var(--muted);text-align:right}
.lb2{white-space:pre-wrap;overflow-wrap:anywhere}
.hblock{display:flex;flex-direction:column;gap:8px}
.hsum{display:flex;flex-direction:column;gap:6px}
.hper{display:flex;flex-wrap:wrap;gap:5px}
.hblock summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
.hlist{display:flex;flex-direction:column;margin-top:6px}
.hrow{display:grid;grid-template-columns:62px 1fr 56px minmax(0,2fr) 36px;gap:8px;align-items:center;font-size:13.5px;padding:4px 0;border-top:1px solid var(--line)}
.hrow .hk{color:var(--muted);overflow-wrap:anywhere}
.txrow{display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.txrow:first-child{border-top:0}
.txrow .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.txrow .mid span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txa{display:flex;gap:6px;flex:0 0 auto}
.task.has-p{background:color-mix(in srgb,var(--pc) 20%,var(--paper));border-color:color-mix(in srgb,var(--pc) 45%,var(--paper));border-left-color:var(--pc)}
.task .who{font-size:12px;color:var(--muted);font-weight:600;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.chip{display:inline-block;padding:0 7px;border-radius:999px;background:var(--cc);color:var(--paper);font-size:11.5px;font-weight:700;line-height:18px}
.osq{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--oc);margin-right:5px;vertical-align:1px}
.cs{display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--cc);flex:0 0 auto;border:1px solid var(--line)}
.strow select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);min-height:38px}
.daypick label .chipdot{width:10px;height:10px;border-radius:50%;background:var(--cc);display:inline-block}
.task.done{opacity:.55}
.task.done .on,.task.done .de{text-decoration:line-through}
.chk{flex:0 0 auto;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:4px;background:var(--paper);display:grid;place-items:center;padding:0;margin-top:1px}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.chk svg{width:13px;height:13px}
.task .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column}

/* Dag for dag (telefon) */
.days{display:none;flex-direction:column;gap:14px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.day>h3{margin:0;padding:8px 12px;background:var(--soft);display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:20px;font-weight:600}
.day>h3 span{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.day.today>h3{background:var(--signal);color:var(--signal-ink)}
.day.today>h3 span{color:var(--signal-ink)}
.day .grp{padding:8px 12px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.day .grp:first-of-type{border-top:0}
.day .grp h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.day .empty{padding:10px 12px;color:var(--muted);font-size:14px}
.day .foot{padding:8px 12px;border-top:1px solid var(--line)}
@media (max-width:760px){.board-scroll{display:none}.days{display:flex}}

/* Ordre */
.list{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.orow{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 0;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.orow:first-child{border-top:0}
.orow .sw{align-self:stretch;background:var(--oc)}
.orow .mid{min-width:0;display:flex;flex-direction:column}
.orow .mid b{font-size:16px}
.orow .mid span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.orow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-family:var(--mono);font-size:12px}
.orow.levert{opacity:.6}
.empty-state{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty-state h3{margin:0;font-family:var(--display);font-size:22px;font-weight:600}
.empty-state p{margin:0;color:var(--muted);max-width:60ch}

/* Stasjoner */
.strow{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.strow:first-child{border-top:0}
.strow input{flex:1;min-width:0}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:5px;width:36px;height:36px;display:grid;place-items:center;padding:0;font-size:15px}

/* Skjema / ark */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@media (min-width:700px){.ov{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:12px}}
.sheet h2{margin:0;font-family:var(--display);font-size:26px;font-weight:600}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.f .lb{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;min-height:40px;width:100%}
.f textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.daypick{display:flex;flex-wrap:wrap;gap:6px}
.daypick label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600;cursor:pointer}
.daypick input{width:auto;min-height:0}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.acts .r{display:flex;gap:8px;margin-left:auto}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--danger-bg);color:var(--danger);border-radius:6px;padding:8px 10px;font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.foot-note{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.note{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--signal);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.note h2{margin:0;font-family:var(--display);font-size:20px;font-weight:600}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.note textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;min-height:70px;width:100%;resize:vertical}
.note .acts{justify-content:flex-end}
.nr{font-family:var(--mono);font-size:.85em;font-weight:500;color:var(--muted)}
.newo{border:1px dashed var(--accent);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--accent) 6%,var(--paper))}
.dlist{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dlist dt{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.dlist dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;font-weight:600;z-index:60;font-size:14px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Grindberg Trevarefabrikk</small>
      <h1>Produksjonsplan <span class="wk" id="wkNo">Uke –</span></h1>
      <div class="range" id="wkRange"></div>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Velg uke">
        <button id="prevWk" type="button" aria-label="Forrige uke">‹</button>
        <button id="thisWk" type="button">Denne uka</button>
        <button id="nextWk" type="button" aria-label="Neste uke">›</button>
      </div>
      <div class="seg" role="group" aria-label="Visning">
        <button id="vUke" type="button" aria-pressed="true">Uke</button>
        <button id="vOrdre" type="button" aria-pressed="false">Ordre</button>
        <button id="vSt" type="button" aria-pressed="false">Oppsett</button>
      </div>
      <div class="seg" role="group" aria-label="Rader"><button id="rAns" type="button">Ansatte</button><button id="rSt" type="button">Stasjoner</button></div>
      <button id="printBtn" class="btn" type="button" hidden>Last ned for utskrift</button>
      <button id="excelBtn" class="btn" type="button" hidden>Excel</button>
    </div>
  </header>

  <div id="status" class="notice">Henter planen …</div>

  <section class="note" id="noteSec" hidden></section>

  <section class="deliveries" id="delivSec" hidden>

<script>
/* Kobler planleggeren til serveren på grindberg-plan.grindberg.workers.dev.
   Etterligner det lille database-grensesnittet planleggeren bruker (doc/collection/onSnapshot/set/update/delete/add),
   og henter endringer fra serveren hvert 5. sekund, så alt er levende. */
(function(){
  var API="https://grindberg-plan.grindberg.workers.dev/api/";
  var KEY="gb-lederkode";
  function getCode(){try{return localStorage.getItem(KEY)||""}catch(e){return ""}}
  function setCode(c){try{c?localStorage.setItem(KEY,c):localStorage.removeItem(KEY)}catch(e){}}
  var code=getCode(),me=null,store={},ver=null,docL=[],colL=[],timer=null;

  function req(method,path,body){
    return fetch(API+path,{method:method,headers:Object.assign({"x-kode":code},body?{"content-type":"application/json"}:{}),body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||"feil");e.code=r.status===401?"revoked":(r.status===403?"invalid_argument":"unavailable");e.status=r.status;throw e}return j})});
  }

  function notify(){docL.forEach(function(l){try{l.cb(snapDoc(l.coll,l.id))}catch(e){console.error(e)}});colL.forEach(function(l){try{l.cb(snapColl(l.coll))}catch(e){console.error(e)}})}
  function pull(force){
    return req("GET","data"+(ver!=null&&!force?"?v="+ver:"")).then(function(j){if(j.same)return;store=j.docs||{};ver=j.v;notify()})
      .catch(function(e){if(e.status===401){setCode("");location.reload()}});
  }
  function split(path){var p=path.split("/");return {coll:p[0],id:p[1]}}
  function local(coll,id,data){store[coll]=store[coll]||{};if(data===null)delete store[coll][id];else store[coll][id]=data;notify()}
  function docRef(path){var p=split(path);return {
    id:p.id,path:path,
    get:function(){return Promise.resolve(snapDoc(p.coll,p.id))},
    set:function(d){local(p.coll,p.id,JSON.parse(JSON.stringify(d)));return req("PUT","doc/"+p.coll+"/"+encodeURIComponent(p.id),d).then(function(){pull(true)})},
    update:function(d){var cur=(store[p.coll]||{})[p.id];if(cur)local(p.coll,p.id,Object.assign({},cur,d));return req("PATCH","doc/"+p.coll+"/"+encodeURIComponent(p.id),d).then(function(){pull(true)})},
    delete:function(){local(p.coll,p.id,null);return req("DELETE","doc/"+p.coll+"/"+encodeURIComponent(p.id)).then(function(){pull(true)})},
    onSnapshot:function(cb){var l={coll:p.coll,id:p.id,cb:cb};docL.push(l);if(ver!=null)setTimeout(function(){cb(snapDoc(p.coll,p.id))},0);return function(){docL=docL.filter(function(x){return x!==l})}}
  }}
  function collRef(coll){return {
    path:coll,
    doc:function(id){return docRef(coll+"/"+(id||("c"+Date.now().toString(36)+Math.random().toString(36).slice(2,8))))},
    add:function(d){return req("POST","doc/"+coll,d).then(function(j){local(coll,j.id,JSON.parse(JSON.stringify(d)));pull(true);return docRef(coll+"/"+j.id)})},
    onSnapshot:function(cb){var l={coll:coll,cb:cb};colL.push(l);if(ver!=null)setTimeout(function(){cb(snapColl(coll))},0);return function(){colL=colL.filter(function(x){return x!==l})}},
    get:function(){return Promise.resolve(snapColl(coll))}
  }}
  var db={doc:docRef,collection:collRef};

  function loginScreen(msg){
    return new Promise(function(resolve){
      var ov=document.createElement("div");ov.className="gb-login";
      ov.innerHTML='<form><h1>Produksjonsplan</h1><p>Logg inn med lederkoden din.</p><p class="e"></p><input id="gb-kode" type="password" autocomplete="current-password" placeholder="Lederkode" aria-label="Lederkode"><button type="submit">Logg inn</button></form>';
      document.body.appendChild(ov);var f=ov.querySelector("form"),i=ov.querySelector("input"),e=ov.querySelector(".e");if(msg)e.textContent=msg;setTimeout(function(){i.focus()},50);
      f.onsubmit=function(ev){ev.preventDefault();code=i.value.trim();req("POST","login").then(function(j){if(j.role!=="leder"){e.textContent="Dette er koden for ansatte. Bruk lederkoden.";return}setCode(code);me=j;ov.remove();resolve()}).catch(function(){e.textContent="Feil kode. Prøv igjen."})};
    });
  }
  var ready=(code?req("POST","login").then(function(j){if(j.role!=="leder")throw 0;me=j}).catch(function(){setCode("");return loginScreen("Logg inn på nytt.")}):loginScreen())
    .then(function(){return pull(true)}).then(function(){timer=setInterval(function(){if(document.visibilityState==="visible")pull(false)},5000);document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")pull(false)})});

  var user={isOwner:function(){return Promise.resolve(true)},canEdit:function(){return Promise.resolve(true)},can:function(){return Promise.resolve(true)},
    id:function(){return Promise.resolve(me&&me.navn||null)},me:function(){return Promise.resolve({id:me&&me.navn,name:me&&me.navn||"",isOwner:true,canEdit:true,email:null,avatarUrl:"",color:"#666"})},profiles:function(){return Promise.resolve({})}};
  var downloads={save:function(o){var b=o.data instanceof Blob?o.data:new Blob([o.data]);var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},2000);return Promise.resolve({status:"saved"})}};
  window.gbLogout=function(){setCode("");location.reload()};
  window.gbMe=function(){return me};
  window.claude={use:function(name){return ready.then(function(){if(name==="db")return db;if(name==="user")return user;if(name==="downloads")return downloads;return null})}};
})();

</script>
<script>
(function(){
const DAYS=["Mandag","Tirsdag","Onsdag","Torsdag","Fredag","Lørdag","Søndag"];
const MONTHS=["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
const DEFAULT_ST=[{id:"cnc",navn:"CNC"},{id:"kant",navn:"Kantliming"},{id:"mont",navn:"Montering"},{id:"lakk",navn:"Lakk"},{id:"lev",navn:"Pakking / levering"}];
const S={db:null,user:null,dl:null,canWrite:false,st:null,stLoaded:false,ordre:[],oppg:[],oLoaded:false,tLoaded:false,uker:{},fravaer:[],timer:[],tripletex:[],visSkjulte:false,tilgang:null,noteEdit:false,week:monday(new Date()),view:"uke",err:""};

/* ---------- datohjelp ---------- */
function pad(n){return String(n).padStart(2,"0")}

/* ---------- DOM-hjelp ---------- */

/* ---------- toppfelt ---------- */
function renderHead(){

  $("printBtn").hidden=!S.dl;

    h("span",{text:"Utskrift: «Last ned for utskrift» lager en A4-fil som åpnes og skrives ut fra nettleseren."}),h("button",{class:"btn ghost",type:"button",style:"min-height:0;padding:2px 8px",text:"Logg ut",onclick:()=>window.gbLogout()})

/* ---------- leveranser ---------- */

      o.hva?h("span",{class:"what",text:o.hva}):null,
      h("span",{class:"when"},short(parse(o.levering))+" ",dueTag(n)));

function renderNote(){

  if(S.view==="st"||(!txt&&!S.canWrite)){sec.hidden=true;return}

  if(S.canWrite&&S.noteEdit){S.noteKey=key;
    const ta=h("textarea",{id:"note-tekst",placeholder:"F.eks. «Uldal-kjøkkenet har første prioritet. Lakk står fredag pga. service.»"});ta.value=txt;
    sec.replaceChildren(title,ta,h("div",{class:"acts"},h("div",{class:"r"},
      h("button",{class:"btn",type:"button",text:"Avbryt",onclick:()=>{S.noteEdit=false;renderNote()}}),
      h("button",{class:"btn primary",type:"button",text:"Lagre beskjed",onclick:async()=>{
        try{await S.db.doc("uker/"+key).set({tekst:ta.value.trim(),endret:Date.now()});S.noteEdit=false;renderNote();toast("Beskjed lagret")}catch(e){toast(writeErr(e))}}}))));
    setTimeout(()=>ta.focus(),20);
  }else if(txt){
    sec.replaceChildren(title,h("div",{class:"txt",text:txt}),S.canWrite?h("div",{class:"acts"},h("div",{class:"r"},h("button",{class:"btn ghost",type:"button",text:"Endre beskjed",onclick:()=>{S.noteEdit=true;renderNote()}}))):null);
  }else{

      h("div",{class:"acts"},h("div",{class:"r"},h("button",{class:"btn",type:"button",text:"+ Skriv beskjed",onclick:()=>{S.noteEdit=true;renderNote()}}))));

function dueTag(n){

  if(n===0)return h("span",{class:"pill late",text:"i dag"});
  if(n<=7)return h("span",{class:"pill soon",text:"om "+n+" d"});
  return h("span",{class:"pill ok",text:"om "+n+" d"});
}

/* ---------- oppgavekort ---------- */
function stName2(id){const x=stations().find(z=>z.id===id);return x?x.navn:""}
function taskCard(t,ctx){
  ctx=ctx||{};const o=orderById(t.ordreId);const ns=names(t);
  const chk=h("button",{class:"chk",type:"button",role:"checkbox","aria-checked":!!t.ferdig,"aria-label":t.ferdig?"Merk som ikke ferdig":"Merk som ferdig",disabled:!S.canWrite||null,onclick:e=>{e.stopPropagation();toggleDone(t)}});

    o?h("span",{class:"on"},h("span",{class:"osq"}),o.nr?h("span",{class:"nr",text:o.nr+" "}):null,o.navn||""):null,
    t.tekst?h("span",{class:o?"de":"on",text:t.tekst}):null,
    (sn||others.length)?h("span",{class:"who"},sn?h("span",{class:"stl",text:sn}):null,ctx.person&&others.length?h("span",{class:"med",text:"med"}):null,others.map(n=>h("span",{class:"chip",style:"--cc:"+pVar(pIdx(n)),text:n}))):null);
  const pi=ctx.person?pIdx(ctx.person):pIdx(ns[0]);
  return h("div",{class:"task"+(t.ferdig?" done":"")+(pi>=0?" has-p":""),style:"--oc:"+oc(o)+(pi>=0?";--pc:var(--p"+pi+")":"")},chk,body);
}
const FTYPER=["Syk","Egenmelding","Sykt barn","Ferie / fri","Lege / tannlege","Kurs","Annet"];
function awayOn(day){return S.fravaer.filter(f=>f.fra&&f.fra<=day&&(f.til||f.fra)>=day).sort((a,b)=>(a.hvem||"").localeCompare(b.hvem||"","nb"))}
function awayChip(f){const pi=pIdx(f.hvem);return h("button",{class:"away",type:"button",style:"--cc:"+pVar(pi),title:(f.type||"")+(f.notat?" – "+f.notat:""),onclick:()=>S.canWrite?openAway(f):null,disabled:!S.canWrite||null},h("span",{class:"chip",style:"--cc:"+pVar(pi),text:f.hvem||"?"}),h("span",{class:"at",text:f.type||"Borte"}))}

/* ---------- rader ---------- */
function rowMode(){return S.rows==="stasjoner"||!staff().length?"stasjoner":"ansatte"}
function sortT(a,b){return (a.rekke||0)-(b.rekke||0)||(a.opprettet||0)-(b.opprettet||0)}
function rowDefs(days){
  if(rowMode()==="stasjoner"){
    return [{id:"_borte",label:"Borte",pi:-1,away:di=>awayOn(di),list:()=>[],borte:true}].concat(stations().map(s=>({id:s.id,label:s.navn,pi:-1,

  const un=di=>S.oppg.filter(t=>t.dato===di&&!names(t).some(n=>st.includes(n))).sort(sortT);
  if(S.canWrite||days.some(d=>un(iso(d)).length))rows.push({id:"_un",label:"Ikke fordelt",pi:-1,list:un,preset:di=>({dato:di,stasjon:(stations()[0]||{}).id})});

/* ---------- ukevisning ---------- */
function renderWeek(){
  const days=weekDays(),sts=stations();
  if(!S.st&&S.stLoaded===false){}
  const rows=rowDefs(days),pm=rowMode()==="ansatte";
  const thead=h("thead",null,h("tr",null,h("th",{class:"st",scope:"col",text:pm?"Ansatt":"Stasjon"}),
    days.map(d=>h("th",{scope:"col",class:iso(d)===TODAY?"today":null},h("span",{class:"dn",text:DAYS[(d.getDay()+6)%7]}),h("span",{class:"dd",text:short(d)})))));
  const tbody=h("tbody",null,rows.map(r=>h("tr",{class:r.borte?"awayrow":(r.person?"prow":null),style:r.pi>=0?"--pc:var(--p"+r.pi+")":null},
    h("th",{class:"st",scope:"row"},r.pi>=0?h("span",{class:"pdot"}):null,r.label),
    days.map(d=>{const di=iso(d);const aw=r.away?r.away(di):[];const ts=r.list(di);
      return h("td",{class:(di===TODAY?"today":"")+(r.person&&aw.length?" isaway":"")},h("div",{class:"cell"+(r.borte?" aw":"")},
        aw.map(awayChip),ts.map(t=>taskCard(t,{person:r.person})),
        S.canWrite?(r.borte?h("button",{class:"add",type:"button","aria-label":"Legg inn fravær "+DAYS[(d.getDay()+6)%7],text:"+ Fravær",onclick:()=>openAway(null,di)}):
          h("button",{class:"add",type:"button","aria-label":"Legg til for "+r.label+" "+DAYS[(d.getDay()+6)%7],text:"+",onclick:()=>openTask(null,r.preset(di))})):null))}))));
  const board=h("div",{class:"board-scroll"},h("table",{class:"board"},thead,tbody));

  const list=h("div",{class:"days"},days.map(d=>{
    const di=iso(d);const groups=rows.map(r=>({r,aw:r.away?r.away(di):[],ts:r.list(di)})).filter(g=>g.ts.length||g.aw.length);
    return h("section",{class:"day"+(di===TODAY?" today":"")},
      h("h3",null,DAYS[(d.getDay()+6)%7],h("span",{text:short(d)})),
      groups.length?groups.map(g=>h("div",{class:"grp"},h("h4",null,g.r.pi>=0?h("span",{class:"pdot",style:"--pc:var(--p"+g.r.pi+")"}):null,g.r.label),
        g.aw.length?h("div",{class:"cell aw",style:"padding:0;min-height:0"},g.aw.map(awayChip)):null,g.ts.map(t=>taskCard(t,{person:g.r.person})))):h("div",{class:"empty",text:"Ingenting planlagt."}),
      S.canWrite?h("div",{class:"foot",style:"display:flex;gap:6px"},h("button",{class:"add",type:"button",style:"flex:1",text:"+ Legg til jobb",onclick:()=>openTask(null,{dato:di,stasjon:(stations()[0]||{}).id})}),h("button",{class:"add",type:"button",text:"+ Fravær",onclick:()=>openAway(null,di)})):null);
  }));

  const nodes=[];

    nodes.push(h("div",{class:"empty-state"},h("h3",{text:"Start med ordrene"}),
      h("p",{text:"Trykk + i ruta for ansatt og dag. Velg en ordre, lag en ny med ordrenummer der og da, eller skriv en vanlig arbeidsoppgave uten ordre."}),
      h("button",{class:"btn primary",type:"button",text:"Legg til første ordre",onclick:()=>openOrder(null)})));
  }

/* ---------- ordrevisning ---------- */
function hoursOf(oid){return S.timer.filter(x=>x.ordreId===oid)}
function fmtH(n){return (Math.round(n*100)/100).toString().replace(".",",")+" t"}
function sumH(list){return list.reduce((a,x)=>a+(Number(x.timer)||0),0)}
function firstTitle(lines){for(const l of lines||[]){const t=((l.b||"").split("\n").find(x=>x.trim())||l.p||"").trim();if(t)return t.length>70?t.slice(0,68)+"…":t}return ""}
function linesBlock(o){
  if(!o.linjer||!o.linjer.length)return null;
  return h("details",{class:"olines",open:true},h("summary",{text:"Ordrelinjer fra Tripletex ("+o.linjer.length+")"}),

function b64(buf){const bytes=new Uint8Array(buf);let s="";const CH=0x8000;for(let i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));return btoa(s)}
async function downloadExcel(){
  if(!S.dl)return;
  try{const wb=await buildWorkbook();const buf=await wb.xlsx.writeBuffer();
    await S.dl.save({filename:"Produksjonsplan Grindberg.xlsx",data:new Blob([buf])});toast("Excel-fila er lagret")}

let syncing=false;
async function syncExcel(){
  const x=S.excel;if(!S.mcp||!x||!x.driveId||syncing)return;
  syncing=true;S.syncMsg="Sender til OneDrive …";refreshExcelPanel();
  try{
    const wb=await buildWorkbook();const buf=await wb.xlsx.writeBuffer();
    const res=await S.mcp.callTool("Microsoft 365","sharepoint_upload_file",{driveId:x.driveId,parentItemId:x.parentItemId||null,filename:x.filnavn||"Produksjonsplan Grindberg.xlsx",conflictBehavior:"replace",contentBase64:b64(buf)},{cache:false});
    const p=res&&res.payload||{};const url=p.webUrl||(p.item&&p.item.webUrl)||x.webUrl||"";
    await S.db.doc("oppsett/excel").set({...x,webUrl:url,sist:Date.now()});
    S.syncMsg="";toast("Excel i OneDrive er oppdatert");
  }catch(e){
    const raw=JSON.stringify((e&&e.result)||e||{});
    if(/Files\.ReadWrite|accessDenied|FORBIDDEN/i.test(raw))S.syncMsg="Microsoft 365-koblingen har bare lesetilgang. Gi den skrivetilgang (se under), så virker knappen.";
    else if(e&&e.code==="not_in_manifest")S.syncMsg="Siden har ikke fått lov til å bruke Microsoft 365. Tillat det i sidens tillatelser og prøv igjen.";
    else if(e&&(e.code==="server_not_connected"||e.code==="needs_reauth"))S.syncMsg="Koble til Microsoft 365 i claude.ai under Innstillinger → Koblinger.";
    else if(e&&e.code==="approval_required")S.syncMsg="Opplastingen trenger godkjenning. Trykk knappen igjen og godkjenn.";
    else if(e&&e.code==="nolib")S.syncMsg="Excel-verktøyet lastet ikke. Last siden på nytt.";
    else S.syncMsg="Fikk ikke sendt til OneDrive. Prøv igjen om litt.";
    if(S.view!=="st")toast(S.syncMsg);
  }finally{syncing=false;refreshExcelPanel();renderHead()}
}

        h("button",{class:"btn",type:"button",text:"Kopier",onclick:()=>{navigator.clipboard.writeText(code).then(()=>toast("Koden er kopiert"),()=>{const r=document.createRange();r.selectNodeContents(cv);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Merket – kopier med Cmd+C")})}})));}

  }
